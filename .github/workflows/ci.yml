name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: CI / Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the independent repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Install checksum-pinned Gitleaks 8.30.1
        run: node scripts/check-gitleaks.mjs --install --check-only

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the complete verification gate
        run: pnpm verify
